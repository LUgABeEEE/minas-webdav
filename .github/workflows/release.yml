name: Release

# Publishing uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere.
# One-time setup on PyPI (Account -> Publishing -> Add a pending publisher):
#   PyPI project name : minas-webdav
#   Owner             : LUgABeEEE
#   Repository name   : minas-webdav
#   Workflow name     : release.yml
#   Environment name  : pypi
# Then push a tag: git tag -a v0.1.0 -m "minas-webdav 0.1.0" && git push --follow-tags

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    # Set the repository variable PYPI_TRUSTED_PUBLISHING=true once the pending
    # publisher exists on PyPI. Until then a tag still builds and creates the
    # GitHub release, it just does not touch PyPI.
    if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: attach artifacts to the GitHub release
    needs: [build, publish]
    if: always() && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
