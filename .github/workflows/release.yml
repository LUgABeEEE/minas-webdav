# SPDX-License-Identifier: Apache-2.0
name: Release

# Publishing uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere.
# One-time setup on PyPI (Account -> Publishing -> Add a pending publisher):
#   PyPI project name : minas-webdav
#   Owner             : LUgABeEEE
#   Repository name   : minas-webdav
#   Workflow name     : release.yml
#   Environment name  : pypi
# Then push a tag: git tag -a vX.Y.Z -m "minas-webdav X.Y.Z" && git push --follow-tags

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    # Set the repository variable PYPI_TRUSTED_PUBLISHING=true once the pending
    # publisher exists on PyPI. Until then a tag still builds and creates the
    # GitHub release, it just does not touch PyPI.
    if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  github-release:
    name: attach artifacts to the GitHub release
    needs: [build, publish]
    if: always() && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/checkout@v7
      - name: Extract the CHANGELOG section for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - "$TAG" <<'PY'
          import pathlib, re, sys

          version = sys.argv[1].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^##\s*\[{re.escape(version)}\].*?$", text, re.M)
          if not match:
              print(f"no CHANGELOG section for {version}", file=sys.stderr)
              raise SystemExit(1)
          rest = text[match.end():]
          nxt = re.search(r"^##\s*\[", rest, re.M)
          body = (rest[: nxt.start()] if nxt else rest).strip()
          if not body:
              print(f"CHANGELOG section for {version} is empty", file=sys.stderr)
              raise SystemExit(1)
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          print(f"{len(body)} chars extracted for {version}")
          PY
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes.md
