name: Release DSH plugin

# Publishes the npm bundle in dsh/ with npm Trusted Publishing (OIDC).
#
# IMPORTANT: npm cannot bootstrap a brand-new package with OIDC - the trusted
# publisher is configured on the package's own settings page, which only exists
# after the first version is on the registry. Bootstrap once with a token:
#
#   cd dsh && npm publish --access public   # NPM_TOKEN in env, never committed
#
# Then add the trusted publisher on
#   https://www.npmjs.com/package/dsh-minas-webdav/access
# GitHub Actions / owner LUgABeEEE / repository minas-webdav /
# workflow release-dsh.yml, and set the repository variable
# NPM_TRUSTED_PUBLISHING=true. From then on a dsh-v* tag publishes without a token.
#
# Release: git tag -a dsh-v0.1.1 -m "dsh-minas-webdav 0.1.1" && git push --follow-tags

on:
  push:
    tags: ["dsh-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish (OIDC)
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: npm CLI that supports trusted publishing
        run: npm install -g npm@11
      - run: npm publish --provenance --access public
