# SPDX-License-Identifier: Apache-2.0
name: CI
permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Windows is the primary platform for `net use` / certutil paths, so
          # it gets the full-range history minus the two oldest interpreters.
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with the MCP extra so its tests actually run)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp,dev]"
      - name: Run the test-suite
        run: python -m unittest discover -s tests -v

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: lint
        run: ruff check .
      - name: format
        run: ruff format --check .

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - name: Install the package + extras
        run: python -m pip install -e ".[mcp]"
      - name: pip-audit
        run: python -m pip_audit --skip-editable --progress-spinner off

  package:
    name: build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip coverage
      - run: python -m pip install -e ".[mcp,dev]"
      - name: Measure and enforce the coverage floor
        # Ratchet, not a target: the Linux runner measured 47% on 2026-11-05
        # (Windows-only branches in probe/proxy cannot execute there; a local
        # Windows run sees 49%), so 46 catches regressions without failing on
        # incidental churn. Raise it whenever real tests land.
        run: |
          python -m coverage run --source=minas_webdav -m unittest discover -s tests
          python -m coverage report --fail-under=46

  # Single stable context for branch protection: matrix job names carry the
  # interpreter version, so requiring them directly would break every time the
  # matrix changes.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [test, lint, audit, package, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every CI job succeeded
        env:
          TEST: ${{ needs.test.result }}
          LINT: ${{ needs.lint.result }}
          AUDIT: ${{ needs.audit.result }}
          PACKAGE: ${{ needs.package.result }}
          COVERAGE: ${{ needs.coverage.result }}
        run: |
          echo "test=$TEST lint=$LINT audit=$AUDIT package=$PACKAGE coverage=$COVERAGE"
          for r in "$TEST" "$LINT" "$AUDIT" "$PACKAGE" "$COVERAGE"; do
            [ "$r" = "success" ] || { echo "not green: $r"; exit 1; }
          done
