[project]
name = "minas-webdav"
version = "0.2.0"
description = "Xiaomi Smart Storage (MINAS) WebDAV control toolkit: CLI, probe, local proxy"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "LUgABeEEE" }]
keywords = ["xiaomi", "minas", "webdav", "nas", "mcp", "cli", "agent"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/LUgABeEEE/minas-webdav"
Documentation = "https://github.com/LUgABeEEE/minas-webdav#readme"
Source = "https://github.com/LUgABeEEE/minas-webdav"
Issues = "https://github.com/LUgABeEEE/minas-webdav/issues"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=7"]

[project.scripts]
minas-webdav = "minas_webdav.cli:main"
minas-webdav-proxy = "minas_webdav.proxy:run"
minas-webdav-probe = "minas_webdav.probe:run"
minas-webdav-mcp = "minas_webdav.mcp_server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["minas_webdav"]

[tool.setuptools.package-data]
minas_webdav = ["minas_config.example.json"]
